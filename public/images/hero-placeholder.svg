<svg width="1920" height="1080" viewBox="0 0 1920 1080" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="1920" height="1080" fill="#0A0A0A"/>
  <!-- Subtle gold gradient glow -->
  <ellipse cx="960" cy="540" rx="600" ry="600" fill="url(#glow)" opacity="0.08"/>
  <!-- Diagonal geometric lines -->
  <line x1="0" y1="0" x2="600" y2="1080" stroke="#C9A227" stroke-width="0.5" opacity="0.08"/>
  <line x1="300" y1="0" x2="900" y2="1080" stroke="#C9A227" stroke-width="0.5" opacity="0.06"/>
  <line x1="1300" y1="0" x2="700" y2="1080" stroke="#C9A227" stroke-width="0.5" opacity="0.06"/>
  <line x1="1600" y1="0" x2="1000" y2="1080" stroke="#C9A227" stroke-width="0.5" opacity="0.08"/>
  <line x1="1920" y1="0" x2="1320" y2="1080" stroke="#C9A227" stroke-width="0.5" opacity="0.05"/>
  <!-- Fashion silhouette -->
  <g opacity="0.04">
    <rect x="760" y="200" width="400" height="700" rx="4" fill="#C9A227"/>
    <rect x="800" y="240" width="320" height="200" rx="2" fill="#C9A227"/>
  </g>
  <defs>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#C9A227"/>
      <stop offset="100%" stop-color="#C9A227" stop-opacity="0"/>
    </radialGradient>
  </defs>
</svg>